<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EF" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Las fuentes se cargaban con un @import dentro de un <style> inyectado
         por React: no empezaban a descargarse hasta que la app renderizaba, y
         el texto saltaba de una fuente a otra. Aquí arrancan con el HTML. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap"
    />

    <title>Nemul — Diseña la iluminación de tu hogar</title>
    <meta name="description" content="Recibe una propuesta de iluminación personalizada para tu hogar en pocos minutos. No necesitas conocimientos técnicos." />
    <link rel="canonical" href="https://www.nemul.app/" />
    <meta property="og:site_name" content="Nemul" />
    <meta property="og:title" content="Nemul — Diseña la iluminación de tu hogar" />
    <meta property="og:description" content="Recibe una propuesta de iluminación personalizada para tu hogar en pocos minutos. No necesitas conocimientos técnicos." />
    <meta property="og:url" content="https://www.nemul.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <!-- Ojo: estas direcciones tienen que apuntar a www. El dominio sin www
         responde con una redirección 308, y los servicios que generan la
         previsualización (WhatsApp, Instagram, Telegram) no la siguen: se
         encuentran un desvío en vez de la imagen y no muestran nada. -->
    <meta property="og:image" content="https://www.nemul.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nemul — estudio de iluminación para tu hogar" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nemul — Diseña la iluminación de tu hogar" />
    <meta name="twitter:description" content="Recibe una propuesta de iluminación personalizada para tu hogar en pocos minutos." />
    <meta name="twitter:image" content="https://www.nemul.app/og-image.png" />
    <meta name="robots" content="index, follow" />
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V6RY9STG4X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V6RY9STG4X');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
