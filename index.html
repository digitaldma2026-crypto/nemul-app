<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EF" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Las fuentes se cargaban con un @import dentro de un <style> inyectado
         por React: no empezaban a descargarse hasta que la app renderizaba, y
         el texto saltaba de una fuente a otra. Aquí arrancan con el HTML. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap"
    />

    <title>Calcula y diseña la iluminación de tu hogar | Nemul</title>
    <meta name="description" content="Calcula la iluminación de cada estancia y recibe recomendaciones sobre lúmenes, temperatura de color y distribución de luminarias para tu hogar." />
    <link rel="canonical" href="https://www.nemul.app/" />
    <meta property="og:site_name" content="Nemul" />
    <meta property="og:title" content="Calcula y diseña la iluminación de tu hogar | Nemul" />
    <meta property="og:description" content="Calcula la iluminación de cada estancia y recibe recomendaciones sobre lúmenes, temperatura de color y distribución de luminarias para tu hogar." />
    <meta property="og:url" content="https://www.nemul.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <!-- Ojo: estas direcciones tienen que apuntar a www. El dominio sin www
         responde con una redirección 308, y los servicios que generan la
         previsualización (WhatsApp, Instagram, Telegram) no la siguen: se
         encuentran un desvío en vez de la imagen y no muestran nada. -->
    <!-- Foto real en vez del gráfico anterior: es la miniatura que ve alguien
         cuando le mandan nemul.app por WhatsApp, y una habitación iluminada
         invita a tocar mucho más que un rótulo. El nombre cambia de .png a
         .jpg a propósito: WhatsApp y Telegram guardan la miniatura por
         dirección, así que con la misma no se habrían enterado del cambio. -->
    <meta property="og:image" content="https://www.nemul.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Despacho iluminado de noche: focos empotrados en el techo, tira LED bajo las estanterías y flexo sobre la mesa" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calcula y diseña la iluminación de tu hogar | Nemul" />
    <meta name="twitter:description" content="Calcula la iluminación de cada estancia y recibe recomendaciones sobre lúmenes, temperatura de color y distribución de luminarias para tu hogar." />
    <meta name="twitter:image" content="https://www.nemul.app/og-image.jpg" />
    <meta name="robots" content="index, follow" />
    <!-- Modo pruebas: para que las visitas de Dayami no cuenten en las
         estadísticas. Se activa abriendo nemul.app/?modo-pruebas=on y se quita
         con ?modo-pruebas=off. Queda guardado solo en ese navegador. Con el
         modo activo no se descarga Google Analytics ni se monta Vercel
         Analytics (ver main.jsx), así que no sale ningún evento. Para el
         resto de visitantes todo funciona igual que antes. -->
    <script>
      (function () {
        var CLAVE = 'nemul_modo_pruebas';
        var activo = false;
        try {
          var orden = new URLSearchParams(window.location.search).get('modo-pruebas');
          if (orden === 'on') localStorage.setItem(CLAVE, '1');
          if (orden === 'off') localStorage.removeItem(CLAVE);
          activo = localStorage.getItem(CLAVE) === '1';
        } catch (e) {
          // sin acceso a localStorage (modo privado, etc.): se mide con normalidad
        }
        window.__nemulModoPruebas = activo;

        if (activo) {
          // Segundo cierre: el interruptor oficial de Google para no medir.
          window['ga-disable-G-V6RY9STG4X'] = true;
          return;
        }

        // Google Analytics 4 (igual que antes, solo que el script se añade desde aquí)
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-V6RY9STG4X';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-V6RY9STG4X');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
